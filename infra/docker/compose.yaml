services:
  postgres:
    image: postgres:16-alpine
    container_name: ad-learning-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ad_learning_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ad_learning_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
